<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>สสจ.สระแก้ว - กำลังนำทาง</title>
  <!-- โหลด LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2D6A4F;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      margin-top: 20px;
      font-size: 15px;
      color: #555;
      font-weight: 500;
      text-align: center;
    }

    .error-box {
      display: none;
      margin-top: 20px;
      background: #FFF3CD;
      border: 1px solid #FFC107;
      border-radius: 10px;
      padding: 16px;
      max-width: 320px;
      width: 100%;
      font-size: 13px;
      color: #856404;
      word-break: break-all;
    }

    .retry-btn {
      display: none;
      margin-top: 16px;
      background: #2D6A4F;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="loader" id="loader"></div>
  <div class="text" id="status">กำลังเชื่อมต่อสิทธิ์ LINE...</div>
  <div class="error-box" id="error-box"></div>
  <button class="retry-btn" id="retry-btn" onclick="window.location.reload()">🔄 ลองใหม่อีกครั้ง</button>

  <script>
    const STREAMLIT_APP_URL = "https://skobooking-9sw2i8bkmvs8mwdey9tgdr.streamlit.app/";
    const LIFF_ID = "2010868445-QCNdgy0s";

    function showError(stage, err) {
      document.getElementById("loader").style.display = "none";
      document.getElementById("status").innerText = "❌ เกิดข้อผิดพลาด";
      var box = document.getElementById("error-box");
      box.style.display = "block";
      box.innerHTML = "<b>ขั้นตอน:</b> " + stage + "<br><b>Error:</b> " + String(err);
      document.getElementById("retry-btn").style.display = "block";

      // ส่งข้อมูล error ไปยัง Streamlit เพื่อแสดงผล (debug)
      setTimeout(function() {
        var errUrl = new URL(STREAMLIT_APP_URL);
        errUrl.searchParams.set("liff_error", stage + ": " + String(err));
        window.location.replace(errUrl.toString());
      }, 4000);
    }

    liff.init({ liffId: LIFF_ID }).then(function() {
      document.getElementById("status").innerText = "เชื่อมต่อ LIFF สำเร็จ กำลังตรวจสอบสิทธิ์...";

      if (!liff.isLoggedIn()) {
        document.getElementById("status").innerText = "กำลังเข้าสู่ระบบ LINE...";
        liff.login();
      } else {
        document.getElementById("status").innerText = "เข้าสู่ระบบสำเร็จ กำลังดึงข้อมูลโปรไฟล์...";

        liff.getProfile().then(function(profile) {
          document.getElementById("status").innerText = "ได้รับข้อมูลแล้ว กำลังนำทาง...";

          var redirectUrl = new URL(STREAMLIT_APP_URL);

          // ส่งต่อค่า Query Parameters ทั้งหมด (เช่น app_id, dept) ไปยัง Streamlit
          var currentUrlParams = new URLSearchParams(window.location.search);
          for (var pair of currentUrlParams) {
            redirectUrl.searchParams.set(pair[0], pair[1]);
          }

          redirectUrl.searchParams.set("userId", profile.userId);
          redirectUrl.searchParams.set("displayName", profile.displayName);
          if (profile.pictureUrl) {
            redirectUrl.searchParams.set("pictureUrl", profile.pictureUrl);
          }

          window.location.replace(redirectUrl.toString());

        }).catch(function(err) {
          showError("getProfile", err);
        });
      }
      setTimeout(() => {
        window.location.replace(STREAMLIT_APP_URL);
      }, 2000);
    });
  </script>
</body>

</html>
